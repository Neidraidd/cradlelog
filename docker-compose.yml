# Runs Cradlelog on 127.0.0.1:8080. Put a reverse proxy that terminates HTTPS in front of it (see README).
# Copy .env.example to .env and fill it in first.
services:
  cradlelog:
    build: .
    image: cradlelog:latest
    container_name: cradlelog
    restart: unless-stopped
    environment:
      CRADLELOG_PASSCODE: ${CRADLELOG_PASSCODE:-}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL (for example https://cradlelog.example.com) in .env}
      CRADLELOG_TZ: ${CRADLELOG_TZ:-Europe/London}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - cradlelog-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  cradlelog-data:
